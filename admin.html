<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>แผงแอดมิน · เลือกพนักงาน</title>
<link rel="stylesheet" href="style.css">
<script src="config.js"></script>
<script src="app.js"></script>
</head>
<body>

  <div class="appbar">
    <div class="brand"><span class="dot">L</span> แผงแอดมิน</div>
    <a class="link" href="dashboard.html">ดูสรุปผล →</a>
  </div>

  <main class="page">
    <div class="card">
      <div class="eyebrow">เลือกพนักงาน</div>
      <h1 class="screen-title">สร้างลิงก์ประเมิน</h1>
      <p class="screen-sub">เลือกพนักงาน แล้วไปหน้าสร้างลิงก์ของคนนั้นโดยเฉพาะ</p>

      <label class="field" for="empSelect">พนักงาน</label>
      <select id="empSelect" style="width:100%;margin-bottom:14px"></select>

      <button class="btn btn-primary" id="goBtn">ไปหน้าสร้างลิงก์ →</button>
    </div>

    <div class="card">
      <div class="recent-head"><h3>หรือแตะเลือกจากรายชื่อ</h3></div>
      <div id="empList"></div>
    </div>
  </main>

  <p class="note">แก้ไขรายชื่อพนักงานได้ในไฟล์ <b>config.js</b></p>

<script>
let employees = [...CONFIG.EMPLOYEES];

function fillSelect(){
  $('#empSelect').innerHTML = employees.map(n => `<option>${n}</option>`).join('');
}
function renderList(){
  $('#empList').innerHTML = employees.map(n => `
    <a class="link-item" href="employee.html?e=${encodeURIComponent(n)}" style="text-decoration:none;color:inherit;cursor:pointer">
      <div class="avatar">${initial(n)}</div>
      <div class="info"><b>${escapeHtml(n)}</b><span>แตะเพื่อสร้างลิงก์ให้พนักงานคนนี้</span></div>
      <span style="color:var(--muted);font-size:20px">›</span>
    </a>`).join('');
}
function goToEmployee(name){ location.href = 'employee.html?e=' + encodeURIComponent(name); }

$('#goBtn').onclick = () => goToEmployee($('#empSelect').value);

fillSelect();
renderList();
</script>
</body>
</html>
